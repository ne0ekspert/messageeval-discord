[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messageeval-discord"
version = "0.1.0"
description = "A Discord bot that evaluates messages with chess-analysis terminology."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["discord", "bot", "message-analysis", "typesafe-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: AsyncIO",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "discord.py>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "typesafe-sdk>=0.7,<0.8",
]

[project.scripts]
messageeval-discord = "messageeval_discord.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/messageeval_discord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
